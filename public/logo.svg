<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Mortarboard flat top — filled -->
  <polygon points="32,8 60,22 32,36 4,22" fill="#2563EB"/>
  <!-- Cap body / bowl — filled -->
