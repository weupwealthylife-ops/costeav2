<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Mortarboard flat top -->
  <polygon points="32,10 58,22 32,34 6,22" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
  <!-- Body / bowl of cap -->
  <path d="M14,26 L14,42 C14,42 32,52 50,42 L50,26" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tassel cord -->
  <line x1="58" y1="22" x2="58" y2="38" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel knot -->
  <circle cx="58" cy="42" r="4" fill="#2563EB"/>
  <!-- Center dot on cap -->
  <circle cx="32" cy="22" r="3" fill="#2563EB"/>
</svg>
