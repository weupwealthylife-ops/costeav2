<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Mortarboard cap - top diamond/board -->
  <polygon points="32,12 60,24 32,36 4,24" fill="#6b7280"/>
  <!-- Shading top face -->
  <polygon points="32,12 60,24 32,30 4,24" fill="#9ca3af"/>
  <!-- Left darker face -->
  <polygon points="4,24 32,36 32,30" fill="#4b5563"/>
  <!-- Right darker face -->
  <polygon points="60,24 32,36 32,30" fill="#374151"/>

  <!-- Tassel cord from right side hanging down -->
  <line x1="60" y1="24" x2="60" y2="40" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="60" cy="42" r="3" fill="#374151"/>
  <!-- Tassel fringe lines -->
  <line x1="57" y1="43" x2="55" y2="51" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="45" x2="60" y2="53" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="63" y1="43" x2="65" y2="51" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
