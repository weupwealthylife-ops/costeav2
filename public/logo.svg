  <!-- Tassel cord -->
  <line x1="60" y1="22" x2="60" y2="40" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="60" cy="44" r="4" fill="#2563EB"/>
  <!-- Highlight on top face -->
  <polygon points="32,8 60,22 32,36 4,22" fill="url(#shine)" opacity="0.12"/>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white"/>
